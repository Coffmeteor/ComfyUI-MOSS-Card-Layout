name: Publish FRAME Nodes 0.3.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated FRAME release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Coffmeteor/ComfyUI-FRAME
          ref: f6087da6d3d1a540bc51ab406f853a0bc1aed0e3
          persist-credentials: false
      - name: Publish with existing publisher credential
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
