name: Publish FRAME Nodes 0.3.4
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated FRAME release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Coffmeteor/ComfyUI-FRAME
          ref: a7f4fd0fa0861990a79da4aa9abd74c414cafc84
          persist-credentials: false
      - name: Publish with existing publisher credential
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          skip_checkout: 'true'
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
